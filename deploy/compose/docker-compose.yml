# Local stack. Nothing here is built yet apart from what comes as an image,
# the three services below with a build context arrive in later issues.
#
#   make up      from the repo root
#   make logs
#   make down

name: ragops

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # no curl in the image, so open the port from bash instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  localai:
    image: localai/localai:v2.25.0-ffmpeg-core
    ports:
      - "${LOCALAI_PORT:-8081}:8080"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODELS_PATH=/models
      - THREADS=${LOCALAI_THREADS:-4}
    volumes:
      - ../localai/models:/models:cached
    healthcheck:
      # /v1/models answers as soon as the server is listening, which is about a
      # minute before the model is loaded and can generate anything. So ask it
      # for one token instead. Costs an inference, tells the truth
      test:
        - CMD-SHELL
        - >-
          curl -sf -m 120 http://localhost:8080/v1/chat/completions
          -H 'Content-Type: application/json'
          -d '{"model":"phi-3.5-mini","messages":[{"role":"user","content":"ok"}],"max_tokens":1}'
          | grep -q choices
      interval: 5m
      timeout: 130s
      retries: 3
      # first run downloads 2.2GB before it can even start loading
      start_period: 45m
      start_interval: 20s

  embeddings:
    build:
      context: ../../services/embeddings
    ports:
      - "${EMBEDDINGS_PORT:-8082}:8000"
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_DIMENSIONS=${EMBEDDING_DIMENSIONS:-384}
      - EMBEDDING_BATCH_SIZE=${EMBEDDING_BATCH_SIZE:-32}
      - EMBEDDING_MAX_TEXTS=${EMBEDDING_MAX_TEXTS:-256}
    healthcheck:
      # /health only reports ok once the model is loaded and has embedded
      # something, so this does not need to do the embedding itself
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
      start_interval: 5s

  # api:          issue 16, ingestion and chat
  # frontend:     issue 23, chat UI

volumes:
  qdrant_storage:
