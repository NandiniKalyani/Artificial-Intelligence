# Local stack. Nothing here is built yet apart from what comes as an image,
# the three services below with a build context arrive in later issues.
#
#   make up      from the repo root
#   make logs
#   make down

name: ragops

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # no curl in the image, so open the port from bash instead
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  localai:
    image: localai/localai:v2.25.0-ffmpeg-core
    ports:
      - "${LOCALAI_PORT:-8081}:8080"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MODELS_PATH=/models
      - THREADS=${LOCALAI_THREADS:-4}
    volumes:
      - ../../models:/models:cached
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
      # the first run downloads a few GB of model, so give it a long runway
      # before compose starts calling it unhealthy
      start_period: 30m
      start_interval: 10s

  # embeddings:   issue 8, sentence-transformers behind a small HTTP API
  # api:          issue 16, ingestion and chat
  # frontend:     issue 23, chat UI

volumes:
  qdrant_storage:
